      background:rgba(0,0,0,0.6);

<body class="bg-black text-white min-h-screen">

<header class="p-4 border-b border-gray-700 flex justify-between items-center">
  <h1 class="text-neon text-2xl font-bold">Akimoz AI Learning Stream</h1>

  <nav class="flex gap-4">
    <a href="index.html" class="hover:text-neon">Home</a>
    <a href="categories.html" class="hover:text-neon">Categories</a>
    <a href="trending.html" class="hover:text-neon">Trending</a>
    <a href="watch-later.html" class="hover:text-neon">Watch Later</a>
    <a href="favorites.html" class="hover:text-neon">Favorites</a>
    <a href="search.html" class="hover:text-neon">Search</a>
  </nav>
</header>

<main class="p-6 max-w-4xl mx-auto">

  <div class="card-neon mb-6">
    <h2 class="text-neon text-xl font-bold mb-3">Search Videos</h2>
    <p class="text-gray-300 leading-relaxed">
      Type any keyword, title, or category to find AI videos instantly.
    </p>
  </div>

  <input
    id="searchInput"
    type="text"
    placeholder="Search AI videos..."
    class="w-full p-3 mb-6 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:border-neon">

  <div id="searchResults" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

</main>

<script>
  async function loadVideos() {
    const res = await fetch("videos.json");
    return await res.json();
  }

  let allVideos = [];

  loadVideos().then(videos => {
    allVideos = videos;
  });

  document.getElementById("searchInput").addEventListener("input", function () {
    const query = this.value.toLowerCase();
    const results = document.getElementById("searchResults");
    results.innerHTML = "";

    if (query.trim() === "") return;

    const filtered = allVideos.filter(v =>
      v.title.toLowerCase().includes(query) ||
      v.category.toLowerCase().includes(query) ||
      v.description.toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
      results.innerHTML = `
        <div class="card-neon col-span-3 text-center">
          <p class="text-gray-300">No results found.</p>
        </div>
      `;
      return;
    }

    filtered.forEach(v => {
      const card = document.createElement("a");
      card.href = `watch.html?id=${v.id}`;
      card.className = "card-neon block";

      card.innerHTML = `
        <h3 class="text-neon font-bold mb-2">${v.title}</h3>
        <p class="text-gray-400 mb-2">${v.category}</p>
        <p class="text-gray-500 text-sm">Watch →</p>
      `;

      results.appendChild(card);
    });
  });
</script>

</body>
</html>
