<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Neon Styles -->
  <style>
    .text-neon {
      color: #00f5ff;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.7);
    }
    .card-neon {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 245, 255, 0.3);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.2);
      transition: 0.2s ease;
    }
    .card-neon:hover {
      box-shadow: 0 0 18px rgba(0, 245, 255, 0.5);
      transform: translateY(-3px);
    }
    .btn-neon {
      background-color: #00f5ff;
      color: black;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 6px;
      transition: 0.2s ease;
    }
    .btn-neon:hover {
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen">

  <!-- Header -->
  <header class="p-4 flex justify-between items-center border-b border-gray-700">
    <h1 class="text-neon text-2xl font-bold">Contact Us</h1>
    <a href="index.html" class="text-sm text-gray-300 hover:text-neon">
      ← Back to Home
    </a>
  </header>

  <!-- Main Content -->
  <main class="p-6 max-w-3xl mx-auto">

    <!-- Contact Info -->
    <div class="card-neon mb-6">
      <h2 class="text-xl font-bold mb-3 text-neon">Get in Touch</h2>
      <p class="text-gray-300 leading-relaxed">
        If you have questions, suggestions, or want to collaborate, feel free to reach out.
      </p>
      <p class="mt-3 text-gray-300">
        Email: <span class="text-neon">akghoneim@hotmail.com</span><br>
        Location: Najran, Saudi Arabia
      </p>
    </div>

    <!-- Contact Form -->
    <div class="card-neon">
      <h2 class="text-xl font-bold mb-3 text-neon">Send a Message</h2>

      <form id="contactForm" class="space-y-4">

        <div>
          <label class="block mb-1 text-gray-300">Your Name</label>
          <input type="text" id="name" class="w-full p-2 rounded bg-gray-900 border border-gray-700 text-white" required>
        </div>

        <div>
          <label class="block mb-1 text-gray-300">Your Email</label>
          <input type="email" id="email" class="w-full p-2 rounded bg-gray-900 border border-gray-700 text-white" required>
        </div>

        <div>
          <label class="block mb-1 text-gray-300">Message</label>
          <textarea id="message" rows="4" class="w-full p-2 rounded bg-gray-900 border border-gray-700 text-white" required></textarea>
        </div>

        <button type="submit" class="btn-neon w-full">Send Message</button>

      </form>

      <p id="statusMsg" class="mt-4 text-neon hidden">Your message has been sent!</p>
    </div>

  </main>

  <!-- Simple Form Logic -->
  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("statusMsg").classList.remove("hidden");
    });
  </script>

</body>
</html>
