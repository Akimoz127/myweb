  <style>
    .text-neon { color:#00f5ff; text-shadow:0 0 8px rgba(0,245,255,0.7); }
    .card-neon {
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(0,245,255,0.3);
      padding:20px;
      border-radius:12px;
      box-shadow:0 0 12px rgba(0,245,255,0.4);

<body class="bg-black text-white min-h-screen">

<header class="p-4 border-b border-gray-700 flex justify-between items-center">
  <h1 class="text-neon text-2xl font-bold">Akimoz AI Learning Stream</h1>

  <nav class="flex gap-4">
    <a href="index.html" class="hover:text-neon">Home</a>
    <a href="categories.html" class="hover:text-neon">Categories</a>
    <a href="trending.html" class="hover:text-neon">Trending</a>
    <a href="watch-later.html" class="hover:text-neon">Watch Later</a>
    <a href="favorites.html" class="hover:text-neon">Favorites</a>
    <a href="search.html" class="hover:text-neon">Search</a>
  </nav>
</header>

<main class="p-6 max-w-4xl mx-auto">

  <div class="card-neon mb-6">
    <h2 class="text-neon text-xl font-bold mb-3">AI Categories</h2>
    <p class="text-gray-300 leading-relaxed">
      Choose a category to explore AI videos organized by topic. Each category loads dynamically from videos.json.
    </p>
  </div>

  <div id="categoryList" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

</main>

<script>
  async function loadVideos() {
    const res = await fetch("videos.json");
    return await res.json();
  }

  loadVideos().then(videos => {
    const categories = [...new Set(videos.map(v => v.category))];
    const list = document.getElementById("categoryList");

    categories.forEach(cat => {
      const card = document.createElement("a");
      card.href = `category.html?name=${encodeURIComponent(cat)}`;
      card.className = "card-neon block";

      card.innerHTML = `
        <h3 class="text-neon font-bold mb-2">${cat}</h3>
        <p class="text-gray-400">Explore videos in ${cat}</p>
      `;

      list.appendChild(card);
    });
  });
</script>

</body>
