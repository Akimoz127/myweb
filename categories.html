<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories – Akimoz AI Stream</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Tajawal:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: 'Inter', 'Tajawal', sans-serif;
      color: #e5e5e5;
    }

    /* Header */
    header {
      padding: 20px;
      border-bottom: 1px solid #00eaff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      color: #00eaff;
      font-weight: 600;
    }

    nav a {
      margin-left: 20px;
      color: #e5e5e5;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      color: #00eaff;
    }

    /* Section Title */
    .section-title {
      font-size: 22px;
      margin: 25px;
      font-weight: 600;
      color: #00eaff;
    }

    /* Category Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Category Card */
    .category-card {
      background: #111;
      border: 1px solid #00eaff;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      transition: 0.25s;
      cursor: pointer;
    }

    .category-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.4);
      color: #00eaff;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Akimoz AI Stream</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="trending.html">Trending</a>
      <a href="favorites.html">Favorites</a>
      <a href="search.html">Search</a>
    </nav>
  </header>

  <!-- Section Title -->
  <div class="section-title">Categories</div>

  <!-- Category Grid -->
  <div class="grid" id="categoryGrid"></div>

  <script>
    async function loadCategories() {
      const response = await fetch('videos.json');
      const videos = await response.json();

      const categories = [...new Set(videos.map(v => v.category))];

      const grid = document.getElementById('categoryGrid');

      categories.forEach(cat => {
        const card = `
          <div class="category-card" onclick="location.href='category.html?name=${encodeURIComponent(cat)}'">
            ${cat}
          </div>
        `;
        grid.innerHTML += card;
      });
    }

    loadCategories();
  </script>

</body>
</html>
