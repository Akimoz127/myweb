<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Videos</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Neon Styles -->
  <style>
    .text-neon {
      color: #00f5ff;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.7);
    }
    .card-neon {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-neon:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.4);
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen">

  <!-- Header -->
  <header class="p-4 flex justify-between items-center border-b border-gray-700">
    <h1 class="text-neon text-2xl font-bold">Trending Videos</h1>
    <a href="index.html" class="text-sm text-gray-300 hover:text-neon">
      ← Back to Home
    </a>
  </header>

  <!-- Main Content -->
  <main class="p-4">
    <div id="trendingList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </main>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
