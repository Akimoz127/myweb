<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .text-neon { color:#00f5ff; text-shadow:0 0 8px rgba(0,245,255,.7); }
    .card-neon { transition:.2s; }
    .card-neon:hover { transform:translateY(-3px); box-shadow:0 0 12px rgba(0,245,255,.4); }
  </style>
</head>

<body class="bg-black text-white min-h-screen">

<header class="p-4 flex justify-between items-center border-b border-gray-700">
  <h1 id="categoryTitle" class="text-neon text-2xl font-bold"></h1>
  <a href="categories.html" class="text-sm text-gray-300 hover:text-neon">← Back</a>
  <input id="searchInput" type="text" placeholder="Search..."
         class="px-3 py-2 rounded bg-gray-800 text-white w-40 md:w-60">
</header>

<main class="p-4">
  <div id="categoryVideos" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
</main>

<script src="app.js"></script>

</body>
</html>
