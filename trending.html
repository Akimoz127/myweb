<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #f1f1f1;
        }

        /* Controls Section */
        .controls {
            max-width: 800px;
            margin: 0 auto 30px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #1f1f1f;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            border-color: #3ea6ff;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .filter-btn {
            background-color: #272727;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #f1f1f1;
            color: #0f0f0f;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .video-card {
            background-color: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 15px;
            flex-grow: 1;
        }

        .video-title {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #f1f1f1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

        let activeCategory = 'All';

        function renderGrid(videos) {
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';

            if (videos.length === 0) {
                gridContainer.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #aaa;">No matching videos found.</p>';
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.classList.add('video-card');

                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${video.thumbnail}" alt="${video.title}">
                    </div>
                    <div class="video-info">
                        <h3 class="video-title">${video.title}</h3>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openModal(video.embed_url);
                });

                gridContainer.appendChild(card);
            });
        }

        function filterVideos() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = videosData.filter(v => {
                const matchesSearch = v.title.toLowerCase().includes(searchVal);
                let matchesCategory = true;

                if (activeCategory === 'Arabic') {
                    matchesCategory = /[\u0600-\u06FF]/.test(v.title);
                } else if (activeCategory !== 'All') {
                    matchesCategory = v.title.toLowerCase().includes(activeCategory.toLowerCase());
                }

                return matchesSearch && matchesCategory;
            });

            renderGrid(filtered);
        }

        function filterCategory(category, btnElement) {
            activeCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            filterVideos();
        }

        document.getElementById('search-input').addEventListener('input', filterVideos);

        function openModal(embedUrl) {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = embedUrl + "?autoplay=1";
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = "";
            modal.classList.remove('active');
        }

        renderGrid(videosData);
    </script>

</html>
