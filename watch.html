<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .text-neon {
      color: #00f5ff;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.7);
    }
    .card-neon {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-neon:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.4);
    }
  </style>
</head>
<head>
  <meta charset="UTF-8">
  <title>Watch Video</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GGHTMRXGEC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GGHTMRXGEC');
  </script>
</head>

<body class="bg-black text-white min-h-screen">

  <header class="p-4 flex justify-between items-center border-b border-gray-700">
    <h1 class="text-neon text-2xl font-bold">AI Learning Stream</h1>
    <a href="index.html" class="text-sm text-gray-300 hover:text-neon">
      ← Back to Home
    </a>
  </header>

  <main class="p-4">

    <!-- Video Player -->
    <iframe id="videoPlayer" class="w-full h-64 md:h-96 rounded-lg mb-4"
            frameborder="0" allowfullscreen></iframe>

    <!-- Title -->
    <h2 id="videoTitle" class="text-xl font-bold mb-4"></h2>

    <!-- Buttons -->
    <button id="watchLaterBtn"
            class="px-4 py-2 bg-gray-800 rounded card-neon mb-4">
      + Add to Watch Later
    </button>

    <button id="favoriteBtn"
            class="px-4 py-2 bg-gray-800 rounded card-neon mb-4">
      ★ Add to Favorites
    </button>

    <!-- Recommended Videos -->
    <h3 class="text-xl font-bold mt-6 mb-4">Recommended Videos</h3>
    <div id="recommendedList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

  </main>

  <script src="app.js"></script>

</body>
</html>
