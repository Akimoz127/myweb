<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Neon Styles -->
  <style>
    .text-neon {
      color: #00f5ff;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.7);
    }
    .btn-neon {
      background-color: #00f5ff;
      color: black;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      transition: 0.2s ease;
    }
    .btn-neon:hover {
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen">

  <!-- Header -->
  <header class="p-4 flex justify-between items-center border-b border-gray-700">
    <h1 class="text-neon text-2xl font-bold">AI Learning Stream</h1>
    <a href="index.html" class="text-sm text-gray-300 hover:text-neon">
      ← Back to Home
    </a>
  </header>

  <!-- Main Content -->
<main class="p-4 max-w-3xl mx-auto">

  <!-- Video Player -->
  <video id="videoPlayer" controls class="w-full rounded-lg mb-4 bg-gray-900"></video>

  <!-- Title -->
  <h2 id="videoTitle" class="text-xl font-bold mb-4"></h2>

  <!-- Action Buttons -->
  <div class="flex gap-3 mb-6">
    <button id="watchLaterBtn" class="btn-neon">+ Add to Watch Later</button>
    <button id="favoriteBtn" class="btn-neon">★ Add to Favorites</button>
  </div>

  <!-- Recommended Videos -->
  <h3 class="text-lg font-bold mb-3">Recommended Videos</h3>
  <div id="recommendedVideos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

</main>
