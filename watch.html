<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .text-neon { color:#00f5ff; text-shadow:0 0 8px rgba(0,245,255,.7); }
    .btn-neon { background:#00f5ff; color:black; padding:8px 16px; border-radius:6px; }
  </style>
</head>

<body class="bg-black text-white min-h-screen">

<header class="p-4 flex justify-between items-center border-b border-gray-700">
  <h1 class="text-neon text-2xl font-bold">AI Learning Stream</h1>
  <a href="index.html" class="text-sm text-gray-300 hover:text-neon">← Back</a>
</header>

<main class="p-4 max-w-3xl mx-auto">

  <video id="videoPlayer" controls class="w-full rounded-lg mb-4 bg-gray-900"></video>

  <h2 id="videoTitle" class="text-xl font-bold mb-4"></h2>

  <button id="watchLaterBtn" class="btn-neon mb-6">+ Add to Watch Later</button>

  <h3 class="text-lg font-bold mb-3">Related Videos</h3>
  <div id="relatedVideos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

</main>

<script src="app.js"></script>

</body>
</html>
