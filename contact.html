<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Akimoz AI Stream</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Tajawal:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: 'Inter', 'Tajawal', sans-serif;
      color: #e5e5e5;
    }

    /* Header */
    header {
      padding: 20px;
      border-bottom: 1px solid #00eaff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      color: #00eaff;
      font-weight: 600;
    }

    nav a {
      margin-left: 20px;
      color: #e5e5e5;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      color: #00eaff;
    }

    /* Contact Box */
    .contact-box {
      max-width: 900px;
      margin: 40px auto;
      background: #111;
      border: 1px solid #00eaff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
    }

    .title {
      font-size: 26px;
      font-weight: 600;
      color: #00eaff;
      margin-bottom: 20px;
    }

    .text {
      font-size: 18px;
      line-height: 1.7;
      color: #d0d0d0;
      margin-bottom: 20px;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      color: #e5e5e5;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #00eaff;
      background: #0d0d0d;
      color: #e5e5e5;
      font-size: 16px;
      outline: none;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    /* Button */
    .btn {
      margin-top: 10px;
      padding: 12px 20px;
      background: #00eaff;
      color: #0d0d0d;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.25s;
      font-size: 16px;
    }

    .btn:hover {
      background: #00c7dd;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Akimoz AI Stream</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="categories.html">Categories</a>
      <a href="trending.html">Trending</a>
      <a href="search.html">Search</a>
    </nav>
  </header>

  <!-- Contact Box -->
  <div class="contact-box">
    <div class="title">Contact Us</div>

    <div class="text">
      If you have any questions, suggestions, or feedback about Akimoz AI Stream,  
      feel free to reach out using the form below.
    </div>

    <div class="form-group">
      <label>Your Name</label>
      <input type="text" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label>Your Email</label>
      <input type="email" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Your Message</label>
      <textarea placeholder="Write your message here..."></textarea>
    </div>

    <button class="btn">Send Message</button>
  </div>

</body>
</html>
