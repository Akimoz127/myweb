<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search – Akimoz AI Stream</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Tajawal:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: 'Inter', 'Tajawal', sans-serif;
      color: #e5e5e5;
    }

    /* Header */
    header {
      padding: 20px;
      border-bottom: 1px solid #00eaff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      color: #00eaff;
      font-weight: 600;
    }

    nav a {
      margin-left: 20px;
      color: #e5e5e5;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      color: #00eaff;
    }

    /* Section Title */
    .section-title {
      font-size: 22px;
      margin: 25px;
      font-weight: 600;
      color: #00eaff;
    }

    /* Search Bar */
    .search-box {
      max-width: 600px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      border: 1px solid #00eaff;
      border-radius: 10px;
      padding: 10px 15px;
      background: #111;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e5e5e5;
      font-size: 18px;
    }

    .search-box input::placeholder {
      color: #777;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Video Card */
    .video-card {
      background: #111;
      border: 1px solid #00eaff;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.25s;
      cursor: pointer;
    }

    .video-card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.4);
    }

    .thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .info {
      padding: 15px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .category {
      margin: 5px 0 0;
      font-size: 14px;
      color: #9e9e9e;
    }

    .views {
      margin: 8px 0 0;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Akimoz AI Stream</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="categories.html">Categories</a>
      <a href="trending.html">Trending</a>
      <a href="favorites.html">Favorites</a>
    </nav>
  </header>

  <!-- Section Title -->
  <div class="section-title">Search Videos</div>

  <!-- Search Bar -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search for videos...">
  </div>

  <!-- Grid -->
  <div class="grid" id="videoGrid"></div>

  <script>
    let allVideos = [];

    async function loadVideos() {
      const response = await fetch('videos.json');
      allVideos = await response.json();
      displayVideos(allVideos);
    }

    function displayVideos(videos) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = "";

      videos.forEach(video => {
        const card = `
          <div class="video-card" onclick="location.href='watch.html?id=${video.id}'">
            <img src="${video.thumbnail}" class="thumb" loading="lazy">
            <div class="info">
              <h3 class="title">${video.title}</h3>
              <p class="category">${video.category}</p>
              <p class="views">${video.views} views</p>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    }

    document.getElementById("searchInput").addEventListener("input", function() {
      const query = this.value.toLowerCase();

      const filtered = allVideos.filter(video =>
        video.title.toLowerCase().includes(query) ||
        video.category.toLowerCase().includes(query)
      );

      displayVideos(filtered);
    });

    loadVideos();
  </script>

</body>
</html>
