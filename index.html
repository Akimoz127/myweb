<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akimoz AI Stream - Home</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Tajawal:wght@400;600&display=swap" rel="stylesheet">

  <!-- Optional External Stylesheet Fallback -->
  <link rel="stylesheet" href="./style.css">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: 'Inter', 'Tajawal', sans-serif;
      color: #e5e5e5;
    }

    /* Header */
    header {
      padding: 20px;
      border-bottom: 1px solid #00eaff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      color: #00eaff;
      font-weight: 600;
    }

    header h1 a {
      color: inherit;
      text-decoration: none;
    }

    nav a {
      margin-left: 20px;
      color: #e5e5e5;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover,
    nav a.active {
      color: #00eaff;
    }

    /* Section Title */
    .section-title {
      font-size: 22px;
      margin: 25px;
      font-weight: 600;
      color: #00eaff;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Video Card */
    .video-card {
      background: #111;
      border: 1px solid #00eaff;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.25s;
      cursor: pointer;
    }

    .video-card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.4);
    }

    .thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .info {
      padding: 15px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .category {
      margin: 5px 0 0;
      font-size: 14px;
      color: #9e9e9e;
    }

    .views {
      margin: 8px 0 0;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1><a href="./index.html">Akimoz AI Stream</a></h1>
    <nav>
      <a href="./index.html" class="active">Home</a>
      <a href="./trending.html">Trending</a>
      <a href="./categories.html">Categories</a>
      <a href="./favorites.html">Favorites</a>
      <a href="./search.html">Search</a>
      <a href="./about.html">About</a>
    </nav>
  </header>

  <!-- Section Title -->
  <div class="section-title">Latest AI Videos</div>

  <!-- Grid -->
  <div class="grid" id="videoGrid"></div>

  <script>
    async function loadVideos() {
      const grid = document.getElementById('videoGrid');
      try {
        let response;
        try {
          response = await fetch('/api/videos');
          if (!response.ok) throw new Error('API unavailable');
        } catch (e) {
          // GitHub Pages static JSON path fallback
          response = await fetch('./data/videos.json');
        }

        if (!response.ok) {
          // Alternative fallback if videos.json is in root
          response = await fetch('./videos.json');
        }

        const videos = await response.json();
        grid.innerHTML = '';

        videos.forEach(video => {
          const thumbnail = video.thumbnail || 'https://via.placeholder.com/320x180/111/00eaff?text=AI+Video';
          const card = `
            <div class="video-card" onclick="location.href='./watch.html?id=${video.id}'">
              <img src="${thumbnail}" class="thumb" loading="lazy" alt="${video.title}">
              <div class="info">
                <h3 class="title">${video.title}</h3>
                <p class="category">${video.category || 'AI'}</p>
                <p class="views">${(video.views || 0).toLocaleString()} views</p>
              </div>
            </div>
          `;
          grid.innerHTML += card;
        });
      } catch (error) {
        console.error('Error loading videos:', error);
        grid.innerHTML = '<p style="color: #ff4d4d; padding: 20px;">Failed to load videos. Please check videos.json path.</p>';
      }
    }

    loadVideos();
  </script>

  <!-- Global App Logic -->
  <script src="./script.js"></script>
</body>
</html>
