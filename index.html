



  

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Streaming App</title>

  <!-- Tailwind Custom Neon Color -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: '#00eaff'
          }
        }
      }
    }
  </script>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
</head>

<body class="bg-black text-white">

  <!-- Header -->
  <header class="p-4 border-b border-gray-700 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-neon drop-shadow-[0_0_10px_#00eaff]">
      My Stream
    </h1>

    <input 
      id="searchInput"
      type="text" 
      placeholder="Search..." 
      class="px-3 py-2 rounded bg-gray-800 focus:outline-none focus:ring-2 focus:ring-neon w-40 md:w-60"
    >
  </header>

  <!-- Main Content -->
  <main class="p-4">
    <h2 class="text-xl mb-4 text-neon font-bold drop-shadow-[0_0_8px_#00eaff]">
      Featured Streams
    </h2>

    <div id="video-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <!-- Cards generated by JS -->
    </div>
  </main>

  <!-- Video Player -->
  <div id="player" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center">
    <div class="w-11/12 md:w-2/3">
      <video id="videoPlayer" controls class="w-full rounded-lg"></video>
      <button onclick="closePlayer()" class="mt-4 px-4 py-2 bg-neon text-black font-bold rounded">
        Close
      </button>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>

  <!-- Register Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker Registered"));
    }
  </script>

</body>
</html>
