<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Platform - Trending</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- The 'trending-page' class tells script.js to sort by views -->
<body class="trending-page">

  <header>
    <h1>Video Platform</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/trending.html" class="active">Trending</a>
    </nav>
  </header>

  <main>
    <section class="controls">
      <h2>🔥 Trending Now</h2>
      <select id="category-filter">
        <option value="All">All Categories</option>
      </select>
    </section>

    <!-- Video grid target for script.js -->
    <div id="video-container" class="video-grid"></div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
