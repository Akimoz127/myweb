<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch – Akimoz AI Stream</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Tajawal:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: 'Inter', 'Tajawal', sans-serif;
      color: #e5e5e5;
    }

    /* Header */
    header {
      padding: 20px;
      border-bottom: 1px solid #00eaff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      color: #00eaff;
      font-weight: 600;
    }

    nav a {
      margin-left: 20px;
      color: #e5e5e5;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      color: #00eaff;
    }

    /* Video Player */
    .player-container {
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
      border: 1px solid #00eaff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
    }

    iframe {
      width: 100%;
      height: 500px;
      border: none;
    }

    /* Video Info */
    .info-box {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #111;
      border: 1px solid #00eaff;
      border-radius: 10px;
    }

    .info-title {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      color: #00eaff;
    }

    .info-category {
      margin-top: 10px;
      font-size: 16px;
      color: #9e9e9e;
    }

    .info-views {
      margin-top: 5px;
      font-size: 14px;
      color: #777;
    }

    /* Section Title */
    .section-title {
      font-size: 22px;
      margin: 25px;
      font-weight: 600;
      color: #00eaff;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Video Card */
    .video-card {
      background: #111;
      border: 1px solid #00eaff;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.25s;
      cursor: pointer;
    }

    .video-card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.4);
    }

    .thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .info {
      padding: 15px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .category {
      margin: 5px 0 0;
      font-size: 14px;
      color: #9e9e9e;
    }

    .views {
      margin: 8px 0 0;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Akimoz AI Stream</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="categories.html">Categories</a>
      <a href="trending.html">Trending</a>
      <a href="search.html">Search</a>
    </nav>
  </header>

  <!-- Video Player -->
  <div class="player-container">
    <iframe id="videoPlayer" allowfullscreen></iframe>
  </div>

  <!-- Video Info -->
  <div class="info-box">
    <h2 class="info-title" id="videoTitle"></h2>
    <p class="info-category" id="videoCategory"></p>
    <p class="info-views" id="videoViews"></p>
  </div>

  <!-- Section Title -->
  <div class="section-title">Recommended Videos</div>

  <!-- Grid -->
  <div class="grid" id="recommendedGrid"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = parseInt(urlParams.get("id"));

    async function loadVideo() {
      const response = await fetch('videos.json');
      const videos = await response.json();

      const video = videos.find(v => v.id === videoId);

      if (!video) return;

      // Load player
      document.getElementById("videoPlayer").src = video.url;

      // Load info
      document.getElementById("videoTitle").innerText = video.title;
      document.getElementById("videoCategory").innerText = "Category: " + video.category;
      document.getElementById("videoViews").innerText = video.views + " views";

      // Recommended videos (same category)
      const recommended = videos.filter(v => v.category === video.category && v.id !== videoId);

      const grid = document.getElementById('recommendedGrid');

      recommended.forEach(v => {
        const card = `
          <div class="video-card" onclick="location.href='watch.html?id=${v.id}'">
            <img src="${v.thumbnail}" class="thumb" loading="lazy">
            <div class="info">
              <h3 class="title">${v.title}</h3>
              <p class="category">${v.category}</p>
              <p class="views">${v.views} views</p>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    }

    loadVideo();
  </script>

</body>
</html>
